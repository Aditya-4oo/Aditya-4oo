<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#16082f" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f3ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#bc13fe" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f7ff" />
      <stop offset="80%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 46px;
        letter-spacing: 2px;
        fill: url(#text-grad);
        filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        letter-spacing: 1px;
        fill: #93c5fd;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1.5px;
        fill: #00f3ff;
      }
      .animated-elements {
        animation: float 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="220" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#00f3ff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="80" x2="900" y2="80" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="100" y1="0" x2="100" y2="220" />
    <line x1="250" y1="0" x2="250" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="550" y1="0" x2="550" y2="220" />
    <line x1="700" y1="0" x2="700" y2="220" />
    <line x1="850" y1="0" x2="850" y2="220" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="120" cy="50" r="70" fill="#00f3ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="140" r="90" fill="#bc13fe" opacity="0.15" filter="url(#glow)" />
  <circle cx="450" cy="30" r="50" fill="#ff0080" opacity="0.08" filter="url(#glow)" />

  <!-- Wave Bottom Layers -->
  <path d="M 0 170 C 180 130, 320 210, 500 160 C 680 110, 780 190, 900 150 L 900 220 L 0 220 Z" fill="url(#wave-grad-2)" />
  <path d="M 0 185 C 160 145, 340 215, 520 175 C 700 135, 800 205, 900 170 L 900 220 L 0 220 Z" fill="url(#wave-grad-1)" />

  <!-- Center Text Content -->
  <g class="animated-elements">
    <!-- Mini Tag -->
    <g transform="translate(330, 35)">
      <rect width="240" height="24" rx="12" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-opacity="0.3" stroke-width="1" />
      <text x="120" y="16" text-anchor="middle" class="badge-text">IIT PATNA • CS &amp; DATA ANALYTICS</text>
    </g>

    <!-- Main Title -->
    <text x="450" y="105" text-anchor="middle" class="title-text">ADITYA OJHA</text>

    <!-- Subtitle -->
    <text x="450" y="140" text-anchor="middle" class="subtitle-text">Full-Stack Engineer  |  State-Level Athlete  |  Health AI Builder</text>
  </g>

  <!-- Sparkle Accents -->
  <g fill="#00f3ff" opacity="0.7">
    <circle cx="180" cy="80" r="2" />
    <circle cx="720" cy="70" r="2.5" />
    <circle cx="280" cy="140" r="1.5" />
    <circle cx="650" cy="130" r="2" />
  </g>
</svg>
